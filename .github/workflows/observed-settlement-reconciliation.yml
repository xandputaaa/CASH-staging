name: CASH witnessed-settlement reconciliation
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '21 * * * *' # UTC hourly, best effort; source remains read-only
  workflow_dispatch:
concurrency:
  group: cash-witness-reconciliation-api
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
  id-token: write # scheduled main-only, read-only short-lived export identity
jobs:
  reconcile-witnessed-research:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate reconciliation logic without external API on pull requests
        if: github.event_name == 'pull_request'
        run: node --test tests/witness-run-window.test.js tests/observed-settlement-reconciler.test.js tests/public-evidence-ledger.test.js tests/witnessed-paper-economics.test.js
      - name: Locate recent successful GitHub-runner witness artifacts
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/witness audit/recovery
          # Fetch all GH API pages. Four scheduled witness runs/hour means
          # 24 latest runs do NOT represent a full 24-hour witness window.
          since_day="$(date -u -d '1 day ago' +%Y-%m-%d)"
          today_day="$(date -u +%Y-%m-%d)"
          # Fail closed when GitHub's API is unavailable. Bounded retries only;
          # never fabricate a witness list or mark reconciliation successful.
          for attempt in 1 2 3; do
            if gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/preexpiry-observer.yml/runs?per_page=100&created=${since_day}..${today_day}" \
              > audit/witness-runs-pages.json; then
              break
            fi
            rm -f audit/witness-runs-pages.json
            if [[ "$attempt" -eq 3 ]]; then
              echo 'CASH_RECON_WITNESS_FETCH_UNAVAILABLE=true' >&2
              exit 1
            fi
            sleep $((attempt * 15))
          done
          node witness-run-window.js \
            audit/witness-runs-pages.json \
            audit/witness-runs.json \
            audit/witness-run-ids.txt
          while IFS= read -r run; do
            if [[ "$run" =~ ^[0-9]{8,16}$ ]]; then
              mkdir -p "audit/witness/$run"
              if gh run download "$run" -n "cash-preexpiry-observation-$run" -D "audit/witness/$run"; then
                echo "CASH_WITNESS_ARCHIVE_READ=$run"
              else
                echo "CASH_WITNESS_ARCHIVE_ABSENT=$run"
              fi
            fi
          done < audit/witness-run-ids.txt
      - name: Fetch protected read-only settlement journals with scheduled GitHub OIDC
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          'use strict';
          const fs=require('node:fs');
          const {githubRunnerReadHeaders}=require('./cash-runner-read-auth');
          const base='https://cash-simulation-web-staging.up.railway.app';
          const routes=[['early','/api/prospective/export'],['late','/api/late-checkpoint/export']];
          const MAX=2500000;
          (async()=>{
            const headers=await githubRunnerReadHeaders();
            if(typeof headers.Authorization!=='string'||
               !headers.Authorization.startsWith('Bearer '))
              throw Error('OIDC_IDENTITY_UNAVAILABLE');
            for(const [label,route] of routes){
              const ctl=new AbortController();
              const timer=setTimeout(()=>ctl.abort(),20000);
              try{
                const response=await fetch(base+route,{
                  headers:{...headers,Accept:'application/json',
                    'User-Agent':'CASH-reconciliation-read-only/1.0'},
                  signal:ctl.signal,redirect:'error'
                });
                if(!response.ok)throw Error('SOURCE_STATUS_'+response.status);
                const len=response.headers.get('content-length');
                if(len!==null&&/^[0-9]+$/.test(len)&&Number(len)>MAX)
                  throw Error('SOURCE_TOO_LARGE');
                if(!response.body||typeof response.body.getReader!=='function')
                  throw Error('SOURCE_NOT_STREAMABLE');
                const reader=response.body.getReader();
                const chunks=[];let size=0;
                while(true){
                  const {done,value}=await reader.read();
                  if(done)break;
                  const piece=Buffer.from(value);
                  size+=piece.length;
                  if(size>MAX){
                    await reader.cancel().catch(()=>{});
                    throw Error('SOURCE_TOO_LARGE');
                  }
                  chunks.push(piece);
                }
                const raw=Buffer.concat(chunks,size);
                const body=new TextDecoder('utf-8',{fatal:true}).decode(raw);
                JSON.parse(body);
                fs.writeFileSync('audit/recovery/'+label+'.json',raw,{mode:0o600});
              }finally{clearTimeout(timer)}
            }
            console.log('CASH_RECON_PRIVATE_SOURCE_FETCH=VERIFIED');
          })().catch(()=>{
            // Never echo bearer tokens, headers or private payloads into runner logs.
            console.error('CASH_RECON_PRIVATE_SOURCE_FETCH=UNAVAILABLE');
            process.exitCode=1;
          });
          NODE
      - name: Diagnose bounded reconciliation input sizes (metadata only)
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          for(const [label,file,limit] of [
            ['run-metadata','audit/witness-runs.json',1000000],
            ['early-export','audit/recovery/early.json',2500000],
            ['late-export','audit/recovery/late.json',2500000]
          ]){
            const size=fs.statSync(file).size;
            console.log('CASH_RECON_INPUT_SIZE '+label+' bytes='+size+' limit='+limit+' withinLimit='+(size<=limit));
          }
          const root='audit/witness';
          let total=0,oversized=0,max=0;
          for(const id of fs.readdirSync(root)){
            const file=path.join(root,id,'public-preexpiry-observation.json');
            if(!fs.existsSync(file))continue;
            const size=fs.statSync(file).size;
            total++;if(size>200000)oversized++;max=Math.max(max,size);
          }
          console.log('CASH_RECON_WITNESS_SIZE files='+total+' oversized='+oversized+' maxBytes='+max+' limit=200000');
          NODE
      - name: Recompute witnessed forecast and numeric Kalshi settlement evidence
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          node observed-settlement-reconcile-cli.js             audit/witness audit/witness-runs.json             audit/recovery/early.json audit/recovery/late.json             audit/report/provisional-reconciliation.json
      - name: Produce read-only BTC15 evidence go/no-go summary (no model promotion)
        if: github.event_name != 'pull_request'
        continue-on-error: true # Report failures must not destroy the original reconciliation artifact
        run: node btc15-evidence-gate.js audit/report/provisional-reconciliation.json audit/report/btc15-evidence-gate.json
      - name: Retain a provisional audit report only (no raw licensed data)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: cash-provisional-settlement-reconciliation-${{ github.run_id }}
          path: |\n            audit/report/provisional-reconciliation.json\n            audit/report/btc15-evidence-gate.json
          retention-days: 30
          if-no-files-found: error
