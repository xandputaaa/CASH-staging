name: CASH witnessed-settlement reconciliation
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '21 * * * *' # UTC hourly, best effort; source remains read-only
  workflow_dispatch:
concurrency:
  group: cash-witness-reconciliation-api
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  reconcile-witnessed-research:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate reconciliation logic without external API on pull requests
        if: github.event_name == 'pull_request'
        run: node --test tests/witness-run-window.test.js tests/observed-settlement-reconciler.test.js tests/public-evidence-ledger.test.js tests/witnessed-paper-economics.test.js
      - name: Locate recent successful GitHub-runner witness artifacts
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/witness audit/recovery
          # Fetch all GH API pages. Four scheduled witness runs/hour means
          # 24 latest runs do NOT represent a full 24-hour witness window.
          since_day="$(date -u -d '1 day ago' +%Y-%m-%d)"
          today_day="$(date -u +%Y-%m-%d)"
          # Fail closed when GitHub's API is unavailable. Bounded retries only;
          # never fabricate a witness list or mark reconciliation successful.
          for attempt in 1 2 3; do
            if gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/preexpiry-observer.yml/runs?per_page=100&created=${since_day}..${today_day}" \
              > audit/witness-runs-pages.json; then
              break
            fi
            rm -f audit/witness-runs-pages.json
            if [[ "$attempt" -eq 3 ]]; then
              echo 'CASH_RECON_WITNESS_FETCH_UNAVAILABLE=true' >&2
              exit 1
            fi
            sleep $((attempt * 15))
          done
          node witness-run-window.js \
            audit/witness-runs-pages.json \
            audit/witness-runs.json \
            audit/witness-run-ids.txt
          while IFS= read -r run; do
            if [[ "$run" =~ ^[0-9]{8,16}$ ]]; then
              mkdir -p "audit/witness/$run"
              if gh run download "$run" -n "cash-preexpiry-observation-$run" -D "audit/witness/$run"; then
                echo "CASH_WITNESS_ARCHIVE_READ=$run"
              else
                echo "CASH_WITNESS_ARCHIVE_ABSENT=$run"
              fi
            fi
          done < audit/witness-run-ids.txt
      - name: Fetch later public-only Kalshi settlement journals
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 --retry 1 --max-filesize 2500000             'https://cash-simulation-web-staging.up.railway.app/api/prospective/export'             --output audit/recovery/early.json
          curl --fail --silent --show-error --location --max-time 30 --retry 1 --max-filesize 2500000             'https://cash-simulation-web-staging.up.railway.app/api/late-checkpoint/export'             --output audit/recovery/late.json
      - name: Diagnose bounded reconciliation input sizes (metadata only)
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          for(const [label,file,limit] of [
            ['run-metadata','audit/witness-runs.json',1000000],
            ['early-export','audit/recovery/early.json',2500000],
            ['late-export','audit/recovery/late.json',2500000]
          ]){
            const size=fs.statSync(file).size;
            console.log('CASH_RECON_INPUT_SIZE '+label+' bytes='+size+' limit='+limit+' withinLimit='+(size<=limit));
          }
          const root='audit/witness';
          let total=0,oversized=0,max=0;
          for(const id of fs.readdirSync(root)){
            const file=path.join(root,id,'public-preexpiry-observation.json');
            if(!fs.existsSync(file))continue;
            const size=fs.statSync(file).size;
            total++;if(size>200000)oversized++;max=Math.max(max,size);
          }
          console.log('CASH_RECON_WITNESS_SIZE files='+total+' oversized='+oversized+' maxBytes='+max+' limit=200000');
          NODE
      - name: Recompute witnessed forecast and numeric Kalshi settlement evidence
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          node observed-settlement-reconcile-cli.js             audit/witness audit/witness-runs.json             audit/recovery/early.json audit/recovery/late.json             audit/report/provisional-reconciliation.json
      - name: Retain a provisional audit report only (no raw licensed data)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: cash-provisional-settlement-reconciliation-${{ github.run_id }}
          path: audit/report/provisional-reconciliation.json
          retention-days: 30
          if-no-files-found: error
