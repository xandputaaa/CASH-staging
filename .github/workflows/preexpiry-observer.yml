name: CASH pre-expiry public research observer
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '12,27,42,57 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'CASH dual-model research snapshot'
      - 'CASH Model Lab shadow public settlement recheck'
      - 'CASH witnessed-settlement reconciliation'
    types: [completed]
permissions:
  contents: read
jobs:
  capture-public-commitment:
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'schedule' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Observe existing public journal; watch next checkpoint when schedule starts late
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "schedule" || "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            # Own scheduled run: at most 12 minutes. Trusted completed scheduled
            # parent: a shorter 3-minute sampling window. No later backfilling.
            node observer-watch.js
          else
            # PR dry run and manual diagnostics are single-pass only.
            node preexpiry-observer.js
          fi
      - name: Record trusted run and scheduled-parent provenance for durable audit
        if: github.event_name == 'schedule' || github.event_name == 'workflow_run'
        env:
          CASH_PARENT_RUN_ID: ${{ github.event.workflow_run.id }}
          CASH_PARENT_NAME: ${{ github.event.workflow_run.name }}
          CASH_PARENT_EVENT: ${{ github.event.workflow_run.event }}
          CASH_PARENT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CASH_PARENT_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CASH_PARENT_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
        run: node late-observer-origin.js
      - name: Retain public-only pre-expiry research evidence without orders
        uses: actions/upload-artifact@v4
        with:
          name: cash-preexpiry-observation-${{ github.run_id }}
          # Keep the legacy top-level summary and every valid observation
          # probe from a delayed scheduled run, preserving original timestamps.
          # Hidden .probe/ scratch outputs are not uploaded by default.
          path: witness/
          retention-days: 30
          if-no-files-found: ignore

      - name: Retain bounded observer capture diagnostics (scheduled runs only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_run'
        uses: actions/upload-artifact@v4
        with:
          name: cash-observer-run-summary-${{ github.run_id }}
          path: witness/observer-run-summary.json
          retention-days: 30
          if-no-files-found: error
