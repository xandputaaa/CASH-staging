name: CASH pre-expiry public research observer
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '12,27,42,57 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture-public-commitment:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Observe existing public journal; watch next checkpoint when schedule starts late
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            node observer-watch.js
          else
            node preexpiry-observer.js
          fi
      - name: Retain only pre-expiry public commitment evidence
        uses: actions/upload-artifact@v4
        with:
          name: cash-preexpiry-observation-${{ github.run_id }}
          # Keep the legacy top-level summary and every valid observation
          # probe from a delayed scheduled run, preserving original timestamps.
          # Hidden .probe/ scratch outputs are not uploaded by default.
          path: witness/
          retention-days: 30
          if-no-files-found: ignore

      - name: Retain bounded observer capture diagnostics (scheduled runs only)
        if: github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: cash-observer-run-summary-${{ github.run_id }}
          path: witness/observer-run-summary.json
          retention-days: 30
          if-no-files-found: error
