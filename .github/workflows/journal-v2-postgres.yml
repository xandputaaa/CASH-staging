name: Journal V2 PostgreSQL integration
on:
  pull_request:
    paths:
      - 'research-journal-v2*'
      - '.github/workflows/journal-v2-postgres.yml'
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: journal_test
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: journal_test
    steps:
      - uses: actions/checkout@v4
      - name: Execute schema in disposable database
        run: psql -X -v ON_ERROR_STOP=1 -f research-journal-v2.sql
      - name: Verify cross-session uniqueness and model isolation
        run: |
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO cash_research_events_v2(stream,sequence,market_id,event_type,event_hash,previous_hash,original_event)
          VALUES ('early:v1:s1',1,'TEST','FORECAST',repeat('a',64),'GENESIS','{}');
          DO $test$
          BEGIN
            BEGIN
              INSERT INTO cash_research_events_v2(stream,sequence,market_id,event_type,event_hash,previous_hash,original_event)
              VALUES ('early:v1:s2',1,'TEST','FORECAST',repeat('b',64),'GENESIS','{}');
              RAISE EXCEPTION 'duplicate accepted';
            EXCEPTION WHEN unique_violation THEN NULL;
            END;
            BEGIN
              INSERT INTO cash_research_events_v2(stream,sequence,market_id,event_type,event_hash,previous_hash,original_event)
              VALUES ('invalid',1,'TEST','FORECAST',repeat('c',64),'GENESIS','{}');
              RAISE EXCEPTION 'invalid stream accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
          END;
          $test$;
          INSERT INTO cash_research_events_v2(stream,sequence,market_id,event_type,event_hash,previous_hash,original_event)
          VALUES ('early:v2:s1',1,'TEST','FORECAST',repeat('d',64),'GENESIS','{}');
          SQL
