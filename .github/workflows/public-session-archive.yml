name: CASH public self-reported session continuity archive
on:
  workflow_run:
    workflows:
      - CASH dual-model research snapshot
    types: [completed]
permissions:
  actions: read
  contents: write
concurrency:
  group: cash-unverified-session-archive-writer
  cancel-in-progress: false
jobs:
  archive-public-proxy-session:
    # Privileged workflow_run: do not execute PR source or artifacts.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'schedule' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      CASH_SOURCE_EVENT: ${{ github.event.workflow_run.event }}
      CASH_SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      CASH_SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      CASH_SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
      CASH_SOURCE_CREATED_AT: ${{ github.event.workflow_run.created_at }}
      CASH_SOURCE_COMPLETED_AT: ${{ github.event.workflow_run.updated_at }}
    steps:
      - name: Checkout trusted default branch sanitizer only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Download exact completed schedule-only research artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source-read-only
          gh run download "$CASH_SOURCE_RUN_ID" \
            -n "cash-public-forecast-unverified-${CASH_SOURCE_RUN_ID}" \
            -D source-read-only
          test -s source-read-only/cash-public-research-unverified.json
      - name: Checkout isolated UNVERIFIED public-session archive branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: cash-public-session-archive
          path: archive-store
          fetch-depth: 1
          persist-credentials: true
      - name: Keep the existing archive as an immutable comparison baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p archive-before-update
          if [[ -d archive-store/public-sessions ]]; then
            cp -a archive-store/public-sessions archive-before-update/
          fi
      - name: Validate source hash chains and append whitelisted public self-reports
        shell: bash
        run: |
          set -euo pipefail
          node public-session-archive.js \
            source-read-only/cash-public-research-unverified.json \
            source-read-only/cash-late-checkpoint-unverified.json \
            archive-store
      - name: Inspect full source-only archive before any branch commit
        shell: bash
        run: |
          set -euo pipefail
          node public-session-archive-inspection.js archive-store
      - name: Verify exact early journal archive coverage and report remaining frozen slots (read only)
        shell: bash
        run: |
          set -euo pipefail
          node early-archive-capacity.js \
            source-read-only/cash-public-research-unverified.json \
            archive-store
          echo 'CASH_EARLY_CAPACITY_REPORT_NEVER_ROTATES_DISK=true'
      - name: Reject any deletion, rewrite or backdated outcome before Git push
        shell: bash
        run: |
          set -euo pipefail
          node public-session-archive-delta.js \
            archive-before-update \
            archive-store \
            "$CASH_SOURCE_RUN_ID"
      - name: Report research journal rollover preflight (read-only, never restart)
        shell: bash
        run: |
          set -euo pipefail
          node research-rollover-preflight.js \
            source-read-only/cash-late-checkpoint-unverified.json \
            archive-store
          echo 'CASH_ROLLOVER_NO_RAILWAY_RESTART=true'
      - name: Commit only new unverified public-session data
        shell: bash
        working-directory: archive-store
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- public-sessions)" ]]; then
            echo 'CASH_SELF_REPORT_ARCHIVE_NO_CHANGES=true'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public-sessions
          git commit -m "Archive unverified public CASH session source (run ${CASH_SOURCE_RUN_ID})"
          git push origin HEAD:cash-public-session-archive
          echo 'CASH_SELF_REPORT_ARCHIVE_COMMITTED=true'
