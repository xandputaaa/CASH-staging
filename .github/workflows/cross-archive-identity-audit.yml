name: CASH cross-archive identity audit
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # A daily read-only audit of distinct public pre-expiry/settled cohorts.
    - cron: '33 3 * * *'
permissions:
  contents: read
jobs:
  cross-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: source
      - uses: actions/checkout@v4
        with:
          ref: cash-public-session-archive
          persist-credentials: false
          path: sessions
      - uses: actions/checkout@v4
        with:
          ref: cash-public-evidence-ledger
          persist-credentials: false
          path: witnesses
      - uses: actions/checkout@v4
        with:
          ref: cash-late-public-witness
          persist-credentials: false
          path: durable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate both archives and compare frozen identities
        run: |
          node source/public-session-archive-inspection.js sessions > /dev/null
          node source/public-ledger-inspection.js witnesses > /dev/null
          node source/cross-archive-identity-audit.js sessions witnesses
          # Public original-run archive never supplies outcomes on its own.
          # Validate its exact original bytes/hashes before identity joining.
          node source/late-public-cohort-audit.js durable witnesses
          # A green observer run may have witnessed NOTHING. Count those
          # valid-but-empty original polls without claiming source outage.
          node source/late-observer-capture-health.js durable
          echo CASH_CROSS_ARCHIVE_IDENTITY_AUDIT=PASS
