name: CASH dual-model research snapshot
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '17,47 * * * *' # UTC, twice hourly, best effort; default branch only
permissions:
  contents: read
  actions: read # read-only archive health inspection
jobs:
  preserve-public-research:
    if: github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Fetch current public read-only CASH forecast export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 --retry 2 \
            --max-filesize 2621440 \
            'https://cash-simulation-web-staging.up.railway.app/api/prospective/export' \
            --output recovery/cash-public-research-unverified.json
      - name: Validate paper-only export and print safe recovery marker
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const file='recovery/cash-public-research-unverified.json';
          const data=fs.readFileSync(file,'utf8');
          if(Buffer.byteLength(data)>2621440)throw Error('Research export too large');
          const r=JSON.parse(data);
          if(!r||r.version!=='CASH_PROSPECTIVE_KALSHI_V1'||
             !['CASH_PROSPECTIVE_HASHED_SESSION_V1','CASH_PROSPECTIVE_REDACTED_COMMITMENTS_V1'].includes(r.format)||
             r.tradingAuthorized!==false||r.automatedOrdersEnabled!==false||
             r.independentlyTimeAttested!==false||r.qualifiedCount!==0||
             r.modelCalibrated!==false||!Array.isArray(r.events)||
             r.events.length>640||!/^[a-f0-9]{64}$/.test(r.headHash)&&r.headHash!=='GENESIS')
             throw Error('Unrecognized or unsafe export; no artifact uploaded');
          if(r.format==='CASH_PROSPECTIVE_REDACTED_COMMITMENTS_V1'&&
             r.events.some(x=>Object.hasOwn(x,'payload')))
             throw Error('Licensed input payload encountered; refuse artifact');
          let last='GENESIS',forecastEvents=0,resolutionEvents=0;
          for(let i=0;i<r.events.length;i++){
            const e=r.events[i];
            if(!e||e.sequence!==i+1||e.previousHash!==last||
               !['FORECAST','OUTCOME'].includes(e.type)||
               !/^[a-f0-9]{64}$/.test(e.hash||''))
               throw Error('Malformed or out-of-order journal event');
            if(r.format==='CASH_PROSPECTIVE_HASHED_SESSION_V1'){
              if(!e.payload||typeof e.payload!=='object')
                throw Error('Missing publicly verifiable research event');
              const {hash,...body}=e;
              const recomputed=crypto.createHash('sha256').update(JSON.stringify(body)).digest('hex');
              if(recomputed!==hash)throw Error('Research journal checksum mismatch');
            }
            if(e.type==='FORECAST')forecastEvents++;
            if(e.type==='OUTCOME')resolutionEvents++;
            last=e.hash;
          }
          if(last!==r.headHash||forecastEvents!==r.records||
             resolutionEvents+r.pending!==r.records||
             r.directional+r.waits!==r.records||
             r.hits+r.misses!==r.officiallyScored)
            throw Error('Research export totals or event chain inconsistent');
          const digest=crypto.createHash('sha256').update(data).digest('hex');
          console.log('CASH_RECOVERY_MODE='+r.format);
          console.log('CASH_RECOVERY_RECORDS='+r.records);
          console.log('CASH_RECOVERY_EVENTS='+r.events.length);
          console.log('CASH_RECOVERY_DIRECTIONAL='+r.directional);
          console.log('CASH_RECOVERY_WAITS='+r.waits);
          console.log('CASH_RECOVERY_RESOLVED='+resolutionEvents);
          console.log('CASH_RECOVERY_PENDING='+r.pending);
          console.log('CASH_RECOVERY_DIRECTIONAL_SCORED='+r.officiallyScored);
          console.log('CASH_RECOVERY_SHA256='+digest);
          console.log('CASH_RECOVERY_QUALIFIED=0');
          console.log('CASH_RECOVERY_IS_NOT_INDEPENDENT_CAPTURE_PROOF=true');
          NODE
      - name: Capture optional separate late-checkpoint export after deployment
        shell: bash
        run: |
          set -euo pipefail
          if curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 --retry 1 \
            --max-filesize 2621440 \
            'https://cash-simulation-web-staging.up.railway.app/api/late-checkpoint/export' \
            --output recovery/cash-late-checkpoint-unverified.json; then
            node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const {assessDefaultLateCapacity}=require('./research-capacity');
          const file='recovery/cash-late-checkpoint-unverified.json';
          const r=JSON.parse(fs.readFileSync(file,'utf8'));
          if(r.version!=='CASH_LATE_CHECKPOINT_SHADOW_V1'||
             r.format!=='CASH_LATE_CHECKPOINT_UNVERIFIED_HASH_CHAIN_V1'||
             r.independentQualification!==0||r.independentlyTimeAttested!==false||
             r.calibrated!==false||r.realMoneyAuthorized!==false||r.canExecuteOrders!==false||
             !Array.isArray(r.events)||r.events.length>320)
            throw Error('Late checkpoint export invalid');
          let prev='GENESIS',frozen=0,resolved=0;
          for(let i=0;i<r.events.length;i++){
            const e=r.events[i];
            if(!e||e.sequence!==i+1||e.previousHash!==prev||
               !['FORECAST','OUTCOME'].includes(e.type)||
               !/^[a-f0-9]{64}$/.test(e.hash||'')||
               !e.payload||typeof e.payload!=='object'||
               Object.hasOwn(e.payload,'spotPrice')||
               Object.hasOwn(e.payload,'sampleWindow')||
               Object.hasOwn(e.payload,'price'))
              throw Error('Late checkpoint chain malformed or contains source-sensitive data');
            const {hash,...body}=e;
            if(crypto.createHash('sha256').update(JSON.stringify(body)).digest('hex')!==hash)
              throw Error('Late checkpoint event checksum mismatch');
            if(e.type==='FORECAST')frozen++;else resolved++;
            prev=hash;
          }
          if(prev!==r.headHash||frozen!==r.records||
             resolved+r.pending!==r.records)
            throw Error('Late checkpoint counts inconsistent');
          const c=r.scorecard?.overall;
          if(!c||c.captured!==frozen||
             c.directional+c.waits!==frozen||
             c.scoredDirectional!==c.hits+c.misses||
             c.scoredDirectional+c.waitResolved+c.voids!==resolved||
             c.pendingDirectional+c.pendingWaits!==r.pending||
             r.scorecard?.qualifiedCount!==0||
             r.scorecard?.independentlyTimeAttested!==false)
            throw Error('Late checkpoint scorecard internally inconsistent');
          const digest=crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          console.log('CASH_LATE_BACKUP_FROZEN='+frozen);
          console.log('CASH_LATE_BACKUP_RESOLVED='+resolved);
          console.log('CASH_LATE_BACKUP_DIRECTIONAL='+c.directional);
          console.log('CASH_LATE_BACKUP_WAITS='+c.waits);
          console.log('CASH_LATE_BACKUP_DIRECTIONAL_SCORED='+c.scoredDirectional);
          console.log('CASH_LATE_BACKUP_HITS='+c.hits);
          console.log('CASH_LATE_BACKUP_MISSES='+c.misses);
          console.log('CASH_LATE_BACKUP_SHA256='+digest);
          const capacity=assessDefaultLateCapacity(r);
          console.log('CASH_LATE_BACKUP_DEFAULT_LIMIT='+capacity.defaultConfiguredMax);
          console.log('CASH_LATE_BACKUP_DEFAULT_REMAINING='+capacity.estimatedRemainingFrozenMarketSlots);
          console.log('CASH_LATE_BACKUP_DEFAULT_CAPACITY_STATUS='+capacity.state);
          console.log('CASH_LATE_BACKUP_QUALIFIED=0');
          NODE
          else
            rm -f recovery/cash-late-checkpoint-unverified.json
            echo 'Late-checkpoint endpoint not yet deployed or temporarily unavailable; early V3 research still backed up.'
          fi
      - name: Save temporary public research ZIP in this GitHub run
        uses: actions/upload-artifact@v4
        with:
          name: cash-public-forecast-unverified-${{ github.run_id }}
          path: recovery/*.json
          retention-days: 30
          if-no-files-found: error
      - name: Read-only PR dry-run of the public self-reported session archiver
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          CASH_SOURCE_EVENT: schedule
          CASH_SOURCE_BRANCH: main
          CASH_SOURCE_HEAD_SHA: ${{ github.sha }}
          CASH_SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          export CASH_SOURCE_CREATED_AT="$(date -u -d '2 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"
          export CASH_SOURCE_COMPLETED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p recovery/public-session-dry-run
          node public-session-archive.js \
            recovery/cash-public-research-unverified.json \
            recovery/cash-late-checkpoint-unverified.json \
            recovery/public-session-dry-run
          echo 'CASH_PUBLIC_SESSION_PR_DRY_RUN_NO_GIT_WRITE=true'
      - name: Audit public freeze-time input chronology after research artifact is safely saved
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s recovery/cash-public-research-unverified.json &&
                -s recovery/cash-late-checkpoint-unverified.json ]]; then
            node forecast-time-integrity.js \
              recovery/cash-public-research-unverified.json \
              recovery/cash-late-checkpoint-unverified.json
          else
            echo 'CASH_TIME_AUDIT_STATUS=UNAVAILABLE_MODEL_JOURNAL_CANNOT_CERTIFY'
            echo 'CASH_TIME_AUDIT_QUALIFIED=0'
          fi
      - name: Observe scheduled reconciliation and ledger archival health (read-only)
        if: github.event_name == 'schedule'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p recovery/health
          if gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/observed-settlement-reconciliation.yml/runs?per_page=100" > recovery/health/reconcile-runs.json && \
             gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/public-evidence-ledger.yml/runs?per_page=100" > recovery/health/ledger-runs.json && \
             gh api "repos/${GITHUB_REPOSITORY}/commits/cash-public-evidence-ledger" > recovery/health/ledger-commit.json; then
            node ledger-archive-health.js \
              recovery/health/reconcile-runs.json \
              recovery/health/ledger-runs.json \
              recovery/health/ledger-commit.json || echo 'CASH_LEDGER_HEALTH_INDETERMINATE=validator_error'
          else
            echo 'CASH_LEDGER_HEALTH_INDETERMINATE=public_github_api_unavailable'
          fi
          echo 'CASH_LEDGER_HEALTH_NEVER_UNLOCKS_TRADING=true'
